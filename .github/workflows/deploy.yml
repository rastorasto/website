name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and restart containers
        run: |
          # If a persistent website folder exists on the runner, update it first
          if [ -d /home/meow/website ]; then
            echo "Updating /home/meow/website from origin/main"
            git -C /home/meow/website fetch origin main
            git -C /home/meow/website reset --hard origin/main
            cd /home/meow/website
            docker compose -f docker-compose.yml up -d --build --remove-orphans
          else
            echo "No persistent folder found, using checked-out workspace"
            docker compose -f docker-compose.yml up -d --build --remove-orphans
          fi

      - name: Notify Discord of deployment
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          echo "Notifying Discord..."
          CONTENT="Deployed ${GITHUB_REPOSITORY}@${GITHUB_SHA} by ${GITHUB_ACTOR}"
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"${CONTENT}\"}" "${DISCORD_WEBHOOK_URL}"
