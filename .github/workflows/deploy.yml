name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    environment: main
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and restart containers
        run: docker compose -f docker-compose.yml up -d --build --remove-orphans

      - name: Notify Discord of Success
        if: success()
        run: |
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"✅ **Deployment Successful**\n**Repo:** ${GITHUB_REPOSITORY}\n**Commit:** ${GITHUB_SHA}\n**Actor:** ${GITHUB_ACTOR}\"}" \
            "${DISCORD_WEBHOOK_URL}"

      - name: Notify Discord of Failure
        if: failure()
        run: |
          curl -sS --fail -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"❌ **Deployment FAILED!**\n**Repo:** ${GITHUB_REPOSITORY}\n**Commit:** ${GITHUB_SHA}\nCheck the GitHub Actions logs for details.\"}" \
            "${DISCORD_WEBHOOK_URL}"
