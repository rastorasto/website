name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and restart containers
        run: docker compose -f docker-compose.yml up -d --build --remove-orphans

      - name: Notify Discord of deployment (verbose)
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not set — skipping notification"
            exit 0
          fi
          echo "Sending Discord notification..."
          curl -vS --fail -X POST -H 'Content-Type: application/json' \
            -d '{"content":"Deployed '${GITHUB_REPOSITORY}'@'${GITHUB_SHA}' by '${GITHUB_ACTOR}'"}' "${DISCORD_WEBHOOK_URL}" \
            && echo "Discord notified successfully"
